name: rust

on: [push, pull_request]

permissions: {}

jobs:
  rust:
    name: Test `cargo check/test/build` on ubuntu-latest
    runs-on: ubuntu-latest

    env:
      CARGO_TERM_COLOR: always

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - run: |
          cargo check --release
          cargo build --release